<!DOCTYPE html>
<html>
<head>
  <title>Diagnostics - Light Dashboard</title>
  <meta charset="utf-8">
  <style>
    body {
      font-family: monospace;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #000;
      color: #0f0;
      line-height: 1.6;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #0f0;
      color: #000;
      border: none;
      cursor: pointer;
      font-family: monospace;
      margin: 10px 5px;
    }
    button:hover {
      background: #0c0;
    }
    #status {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #0f0;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .error { color: #f00; }
    .success { color: #0f0; }
    .warning { color: #ff0; }
  </style>
</head>
<body>
  <h1>Dashboard Diagnostics</h1>
  
  <h2>Service Worker Status</h2>
  <button onclick="checkServiceWorkers()">Check Service Workers</button>
  <button onclick="clearEverything()">FORCE CLEAR EVERYTHING</button>
  <button onclick="testZerionDirect()">Test Zerion API Direct</button>
  
  <div id="status"></div>
  
  <script>
    const status = document.getElementById('status');
    
    async function checkServiceWorkers() {
      status.innerHTML = '';
      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        status.innerHTML += `<div class="success">Found ${registrations.length} service worker(s):</div>\n`;
        for (const reg of registrations) {
          status.innerHTML += `  - ${reg.active?.scriptURL || 'inactive'}\n`;
          status.innerHTML += `    State: ${reg.active?.state || 'N/A'}\n`;
          status.innerHTML += `    Scope: ${reg.scope}\n\n`;
        }
        
        const cacheNames = await caches.keys();
        status.innerHTML += `<div class="success">Found ${cacheNames.length} cache(s):</div>\n`;
        for (const name of cacheNames) {
          const cache = await caches.open(name);
          const keys = await cache.keys();
          status.innerHTML += `  - ${name} (${keys.length} entries)\n`;
          
          // Check for Zerion URLs
          const zerionUrls = keys.filter(req => req.url.includes('api.zerion.io'));
          if (zerionUrls.length > 0) {
            status.innerHTML += `    <span class="warning">⚠️ Contains ${zerionUrls.length} Zerion URL(s):</span>\n`;
            zerionUrls.forEach(req => {
              status.innerHTML += `      ${req.url}\n`;
            });
          }
        }
      } catch (error) {
        status.innerHTML += `<div class="error">Error: ${error.message}</div>\n`;
      }
    }
    
    async function clearEverything() {
      status.innerHTML = '⏳ Clearing everything...\n\n';
      
      try {
        // Unregister service workers
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (const registration of registrations) {
          await registration.unregister();
          status.innerHTML += '<div class="success">✓ Unregistered service worker</div>\n';
        }
        
        // Clear all caches
        const cacheNames = await caches.keys();
        for (const cacheName of cacheNames) {
          await caches.delete(cacheName);
          status.innerHTML += `<div class="success">✓ Deleted cache: ${cacheName}</div>\n`;
        }
        
        // Clear storage
        localStorage.clear();
        status.innerHTML += '<div class="success">✓ Cleared localStorage</div>\n';
        
        sessionStorage.clear();
        status.innerHTML += '<div class="success">✓ Cleared sessionStorage</div>\n';
        
        status.innerHTML += '\n<div class="success">✅ All done! Reloading in 2 seconds...</div>\n';
        
        setTimeout(() => {
          window.location.href = '/new/';
        }, 2000);
        
      } catch (error) {
        status.innerHTML += `<div class="error">❌ Error: ${error.message}</div>\n`;
      }
    }
    
    async function testZerionDirect() {
      status.innerHTML = '⏳ Testing Zerion API...\n\n';
      
      // Get settings
      const settingsStr = localStorage.getItem('myDashboardSettings.v1');
      if (!settingsStr) {
        status.innerHTML += '<div class="error">No settings found in localStorage</div>\n';
        return;
      }
      
      const settings = JSON.parse(settingsStr);
      const apiKey = settings.zerionApiKey;
      const wallet = settings.walletAddresses?.split(',')[0]?.trim();
      
      if (!apiKey) {
        status.innerHTML += '<div class="error">No Zerion API key in settings</div>\n';
        return;
      }
      
      if (!wallet) {
        status.innerHTML += '<div class="error">No wallet address in settings</div>\n';
        return;
      }
      
      status.innerHTML += `API Key: ${apiKey.substring(0, 10)}...\n`;
      status.innerHTML += `Wallet: ${wallet}\n\n`;
      
      // Test direct fetch (bypass service worker)
      const url = `https://api.zerion.io/v1/wallets/${wallet}/positions/?currency=usd&sort=value`;
      status.innerHTML += `Testing URL: ${url}\n\n`;
      
      try {
        const token = btoa(apiKey + ':');
        const response = await fetch(url, {
          headers: {
            'Authorization': `Basic ${token}`,
            'accept': 'application/json'
          },
          cache: 'no-store' // Force bypass cache
        });
        
        status.innerHTML += `Response Status: ${response.status} ${response.statusText}\n`;
        status.innerHTML += `CORS Headers:\n`;
        response.headers.forEach((value, key) => {
          if (key.toLowerCase().includes('access-control') || key.toLowerCase().includes('origin')) {
            status.innerHTML += `  ${key}: ${value}\n`;
          }
        });
        
        if (response.ok) {
          const data = await response.json();
          status.innerHTML += `\n<div class="success">✅ Success! Got ${data.data?.length || 0} positions</div>\n`;
        } else {
          const text = await response.text();
          status.innerHTML += `\n<div class="error">❌ Failed: ${text.substring(0, 200)}</div>\n`;
        }
      } catch (error) {
        status.innerHTML += `\n<div class="error">❌ Error: ${error.message}</div>\n`;
      }
    }
    
    // Auto-check on load
    checkServiceWorkers();
  </script>
</body>
</html>
