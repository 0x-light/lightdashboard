<!DOCTYPE html>
<html>
<head>
  <title>Clear Cache - Light Dashboard</title>
  <style>
    body {
      font-family: monospace;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #000;
      color: #0f0;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #0f0;
      color: #000;
      border: none;
      cursor: pointer;
      font-family: monospace;
      margin: 10px 5px;
    }
    button:hover {
      background: #0c0;
    }
    #status {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #0f0;
    }
  </style>
</head>
<body>
  <h1>Clear Cache & Service Worker</h1>
  <p>This will clear all cached data and reload the page with fresh data.</p>
  
  <button onclick="clearEverything()">Clear Everything & Reload</button>
  <button onclick="window.location.href='/'">Back to Dashboard</button>
  
  <div id="status"></div>
  
  <script>
    async function clearEverything() {
      const status = document.getElementById('status');
      
      try {
        status.innerHTML = '⏳ Unregistering service workers...<br>';
        
        // Unregister all service workers
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (const registration of registrations) {
          await registration.unregister();
          status.innerHTML += '✓ Unregistered service worker<br>';
        }
        
        status.innerHTML += '⏳ Clearing caches...<br>';
        
        // Clear all caches
        const cacheNames = await caches.keys();
        for (const cacheName of cacheNames) {
          await caches.delete(cacheName);
          status.innerHTML += `✓ Deleted cache: ${cacheName}<br>`;
        }
        
        status.innerHTML += '⏳ Clearing localStorage...<br>';
        localStorage.clear();
        status.innerHTML += '✓ Cleared localStorage<br>';
        
        status.innerHTML += '⏳ Clearing sessionStorage...<br>';
        sessionStorage.clear();
        status.innerHTML += '✓ Cleared sessionStorage<br>';
        
        status.innerHTML += '<br>✅ All done! Reloading in 2 seconds...<br>';
        
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
        
      } catch (error) {
        status.innerHTML += `<br>❌ Error: ${error.message}<br>`;
      }
    }
  </script>
</body>
</html>
